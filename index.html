<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ricochet Regiment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: one fitted arena canvas (toy blocks on a sand-colored desk), HUD strip above, control legend below, on a dark workshop surround. Single committed dark look. */
:root{
  --bg:#17140f;
  --panel:#221d16;
  --ink:#f1e6cf;
  --muted:#a8987b;
  --line:#3a3126;
  --accent:#f2b90f;
  --p1:#3fae4a; --p2:#e5484d; --p3:#3e7bfa; --p4:#f2b90f;
  --display:'Bungee','Impact','Arial Black',system-ui,sans-serif;
  --body:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;
  padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 18px;font-size:13px}
.hgroup{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.hgroup.net{align-items:center}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#hud b{font-family:var(--display);font-weight:400;font-size:16px;font-variant-numeric:tabular-nums}
#h-name{color:var(--muted)}
#h-ff{padding:1px 6px;border:1px solid var(--line);border-radius:3px}
#h-ff[data-on="1"]{color:var(--p2);border-color:var(--p2)}
.hud-slots{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 4px;border:1px solid var(--line);border-radius:4px;background:var(--panel);font-variant-numeric:tabular-nums;min-width:74px}
.chip i{width:14px;height:14px;border-radius:3px;background:var(--c);display:block}
.chip b{font-size:12px!important}
.chip span{font-size:12px;color:var(--muted)}
.chip[data-state="empty"]{opacity:.35}
.chip[data-state="empty"] i{background:transparent;border:1px dashed var(--muted)}
.chip[data-state="down"] i{background:repeating-linear-gradient(45deg,var(--c) 0 3px,transparent 3px 6px)}
.chip[data-state="down"] span{color:var(--p2)}
.hbtn{font:600 12px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer;letter-spacing:.04em}
.hbtn:hover{border-color:var(--muted)}
.hbtn[data-on="1"]{background:var(--p1);color:#10140f;border-color:var(--p1)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#wrap{flex:1;min-height:0;display:grid;place-items:center}
#frame{position:relative;container-type:size;box-shadow:0 0 0 1px #000,0 18px 50px rgba(0,0,0,.55);border-radius:6px;overflow:hidden;background:#e2d3b2}
#cv{display:block;width:100%;height:100%;cursor:crosshair}
#overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:clamp(10px,1.6cqw,17px)}
#legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 22px;font-size:12px;color:var(--muted)}
#legend > div{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:center}
#legend strong{color:var(--ink);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.btn{display:inline-grid;place-items:center;width:1.55em;height:1.55em;border-radius:50%;font-weight:700;color:#14110d;font-size:.82em;vertical-align:.08em;font-family:var(--body)}
.btn.a{background:var(--p1)}.btn.b{background:var(--p2)}.btn.x{background:var(--p3)}.btn.y{background:var(--p4)}
.k{display:inline-block;border:1px solid currentColor;border-radius:3px;padding:0 .4em;font-size:.78em;font-weight:700;letter-spacing:.06em;line-height:1.45;vertical-align:.08em}

/* overlay panels */
.panel{background:rgba(23,20,15,.9);border:1px solid #4a3e2f;border-radius:6px;padding:1.4em 1.8em;max-width:80%;display:flex;flex-direction:column;gap:.9em;box-shadow:0 10px 40px rgba(0,0,0,.4);box-sizing:border-box}
.title{align-items:stretch;width:72%;max-height:94%;overflow:auto;pointer-events:auto}
.title h1{font-family:var(--display);font-weight:400;font-size:3.6em;line-height:.92;margin:0;color:var(--ink);text-wrap:balance;letter-spacing:.01em}
.title h1 span{color:var(--accent)}
.sub{margin:0;color:var(--muted);font-size:1em;max-width:46em}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:.6em}
.slot{border:1px dashed #5a4b39;border-radius:5px;padding:.6em;display:flex;flex-direction:column;gap:.4em;min-height:5em;min-width:0}
.slot .pn{font-family:var(--display);font-size:1.35em;color:var(--muted)}
.slot .dv{font-size:.85em;color:var(--muted);overflow-wrap:anywhere}
.slot.on{border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.slot.on .pn{color:var(--c)}
.slot.on .dv{color:var(--ink)}
.cust{display:flex;flex-direction:column;gap:.35em;font-size:.85em}
.crow{display:flex;align-items:center;gap:.35em;min-width:0}
.crow .nm{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arr,.mini{font:700 1em var(--body);background:rgba(255,255,255,.08);color:var(--ink);border:1px solid #5a4b39;border-radius:3px;cursor:pointer}
.arr{width:1.8em;height:1.8em;padding:0;line-height:1;flex:none}
.mini{padding:.25em .55em;font-weight:600}
.arr:hover,.mini:hover{border-color:var(--c,var(--muted))}
.thumb{width:1.9em;height:1.9em;border-radius:3px;background:rgba(0,0,0,.35) center/contain no-repeat;border:1px solid #5a4b39;flex:none}
.sw{width:.85em;height:.85em;border-radius:2px;background:var(--c);display:inline-block;vertical-align:-.05em;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.row{display:flex;flex-wrap:wrap;gap:.5em 1.4em;align-items:center}
.go{font-family:var(--display);font-size:1.3em;color:var(--accent);animation:pulse 1.4s ease-in-out infinite}
.note{font-size:.85em;color:var(--muted)}
.note b{color:var(--ink)}
.warn{font-size:.9em;color:#ffb4a8;border-left:3px solid var(--p2);padding-left:.7em}
.banner{text-align:center;align-items:center;background:rgba(23,20,15,.82)}
.eyebrow{font-size:.85em;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.banner h2{font-family:var(--display);font-weight:400;font-size:3.2em;margin:0;line-height:1;text-wrap:balance}
.roster{display:flex;flex-wrap:wrap;justify-content:center;gap:.4em 1.1em}
.roster span{display:inline-flex;align-items:center;gap:.4em}
.dot{width:.85em;height:.85em;border-radius:2px;background:var(--c);display:inline-block;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.stats{display:grid;grid-template-columns:auto auto auto;gap:.3em 1.6em;font-variant-numeric:tabular-nums;text-align:left}
.stats .h{font-size:.75em;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* online dialog */
#net{position:fixed;inset:0;background:rgba(10,8,6,.72);display:grid;place-items:center;z-index:20;padding:16px}
.net-card{background:var(--panel);border:1px solid #4a3e2f;border-radius:8px;padding:20px 22px;width:min(440px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.net-card h3{font:400 22px var(--display);margin:0}
.net-card p{margin:0}
.field{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.joinrow input{font:600 15px var(--body);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px 10px;letter-spacing:normal;text-transform:none;min-width:0}
.joinrow{display:flex;gap:8px}
.joinrow input{flex:1;text-transform:uppercase;letter-spacing:.25em}
.pbtn{font:700 14px var(--body);border-radius:4px;padding:9px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#17140f}
.pbtn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.pbtn.ghost:hover{border-color:var(--muted)}
.or{font-size:12px;color:var(--muted);text-align:center}
.roomline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.roomcode{font:400 34px var(--display);letter-spacing:.12em;color:var(--accent);user-select:all}
#net-roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#net-roster li{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:4px}
.tag{font-size:12px;color:var(--muted)}
.tag.on{color:var(--p1)}
#net-status{font-size:13px;color:var(--muted);min-height:1em}
#net-status[data-err="1"]{color:#ffb4a8}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}

.skillp{width:76%;pointer-events:auto;text-align:center;align-items:center}
.skillp h2{font-family:var(--display);font-weight:400;font-size:2.6em;margin:0;line-height:1}
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em;width:100%}
.sk{border:1px solid #5a4b39;border-radius:6px;padding:1em;cursor:pointer;background:rgba(255,255,255,.04);text-align:left;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:.45em;min-width:0}
.sk h4{font:400 1.25em var(--display);margin:0;color:var(--ink)}
.sk:hover{border-color:var(--muted)}
.sk.sel{border-color:var(--accent);background:rgba(242,185,15,.12);box-shadow:inset 0 0 0 2px var(--accent)}
.sk.sel h4{color:var(--accent)}
.sk{--rc:#b9ab8e;border-top:3px solid var(--rc)}
.sk .stat{margin-top:auto;padding:.5em .6em;border-radius:4px;background:rgba(0,0,0,.28);font-size:.9em;color:var(--muted);line-height:1.5}
.sk .stat b{color:var(--ink);font-size:1.15em;font-variant-numeric:tabular-nums}
.sk .stat b.to{color:var(--rc)}
.sk .stat .arrow{color:var(--muted);padding:0 .2em}
.sk .rar{font-size:.72em;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--rc)}
.r-rare{--rc:#4f8dff}.r-epic{--rc:#b07cff}.r-legendary{--rc:#ff9a3d}.r-mythic{--rc:#ff4fd8}
.sk.r-rare,.sk.r-epic,.sk.r-legendary{background:color-mix(in srgb,var(--rc) 10%,transparent)}
.sk.r-legendary{box-shadow:0 0 18px color-mix(in srgb,var(--rc) 35%,transparent)}
.sk.r-mythic{background:linear-gradient(135deg,rgba(255,79,216,.2),rgba(242,185,15,.16),rgba(79,141,255,.2));animation:myth 2.2s ease-in-out infinite}
.sk.r-mythic h4{background:linear-gradient(90deg,#ff4fd8,#f2b90f,#4f8dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sk.sel{border-color:var(--rc);box-shadow:inset 0 0 0 2px var(--rc),0 0 22px color-mix(in srgb,var(--rc) 40%,transparent);transform:translateY(-4px)}
.sk.sel h4{color:var(--rc)}
.sk.r-mythic.sel h4{color:transparent}
.own.r-rare,.own.r-epic,.own.r-legendary,.own.r-mythic{color:var(--rc)}
@keyframes myth{0%,100%{box-shadow:0 0 0 1px #ff4fd8,0 0 18px rgba(255,79,216,.45)}50%{box-shadow:0 0 0 1px #f2b90f,0 0 28px rgba(242,185,15,.55)}}
@media (prefers-reduced-motion:reduce){.sk.r-mythic{animation:none}}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.go{animation:none}}
@media (max-width:700px){#legend{display:none}.title,.skillp{width:auto}.slots{grid-template-columns:repeat(2,1fr)}.skills{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hgroup"><span class="lbl">Level</span><b id="h-stage">–</b><span id="h-name"></span></div>
    <div class="hgroup"><span class="lbl">Enemies</span><b id="h-enemies">–</b><span class="lbl">Lives</span><b id="h-lives">–</b><span class="lbl" id="h-ff">Friendly fire off</span></div>
    <div class="hgroup net"><button id="net-btn" class="hbtn" type="button">Play online</button><button id="voice-btn" class="hbtn" type="button" hidden>Voice off</button></div>
    <div class="hud-slots">
      <div class="chip" data-state="empty" style="--c:var(--p1)"><i></i><b>P1</b><span>–</span></div>
      <div class="chip" data-state="empty" style="--c:var(--p2)"><i></i><b>P2</b><span>–</span></div>
      <div class="chip" data-state="empty" style="--c:var(--p3)"><i></i><b>P3</b><span>–</span></div>
      <div class="chip" data-state="empty" style="--c:var(--p4)"><i></i><b>P4</b><span>–</span></div>
    </div>
  </header>
  <div id="wrap"><div id="frame"><canvas id="cv"></canvas><div id="overlay"></div></div></div>
  <footer id="legend">
    <div><strong>Controller</strong><span>Left stick move</span><span>Right stick aim</span><span><span class="k">RT</span> / <span class="btn x">X</span> fire</span><span><span class="k">LT</span> / <span class="btn a">A</span> mine</span><span><span class="k">START</span> pause</span><span><span class="k">VIEW</span> voice</span></div>
    <div><strong>Keyboard</strong><span>WASD move</span><span>Mouse aim</span><span>Click / Space fire</span><span>Right-click / E mine</span><span>Esc pause</span><span>V voice</span></div>
  </footer>
</div>

<div id="net" hidden>
  <div class="net-card" role="dialog" aria-modal="true" aria-labelledby="net-title">
    <h3 id="net-title">Play online</h3>
    <label class="field">Your name<input id="net-name" maxlength="16" autocomplete="nickname"></label>
    <div id="net-offline" style="display:flex;flex-direction:column;gap:12px">
      <button id="net-host" class="pbtn" type="button">Host a game</button>
      <div class="or">or join a friend's game</div>
      <div class="joinrow"><input id="net-code" maxlength="5" placeholder="CODE" autocomplete="off" aria-label="Room code"><button id="net-join" class="pbtn" type="button">Join</button></div>
    </div>
    <div id="net-online" hidden style="flex-direction:column;gap:12px">
      <div class="roomline"><span class="lbl">Room code</span><span id="net-room" class="roomcode"></span><button id="net-copy" class="pbtn ghost" type="button">Copy</button></div>
      <p class="note" id="net-hint"></p>
      <ul id="net-roster"></ul>
      <button id="net-voice" class="pbtn ghost" type="button">Turn voice chat on</button>
    </div>
    <p id="net-status" role="status"></p>
    <div class="btnrow"><button id="net-leave" class="pbtn ghost" type="button" hidden>Leave room</button><button id="net-close" class="pbtn ghost" type="button">Close</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
// ---------- constants ----------
const TS = 40, COLS = 24, ROWS = 16, W = TS * COLS, H = TS * ROWS, R = 14, TAU = Math.PI * 2;
const PSPEED = 105, PBS = 255, PMAX = 5, PCD = 0.16, MINE_R = 72, STEP = 4;
const COLORS = [['Green', '#3fae4a'], ['Red', '#e5484d'], ['Blue', '#3e7bfa'], ['Yellow', '#f2b90f'], ['Orange', '#f0802a'], ['Purple', '#9b5de5'],
  ['Cyan', '#22c3d6'], ['Pink', '#f472b6'], ['Lime', '#9ad41f'], ['Teal', '#14a37f'], ['White', '#f4f1ea'], ['Black', '#2a2a2e']];
const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16); return `rgb(${Math.round((n >> 16) * k)},${Math.round((n >> 8 & 255) * k)},${Math.round((n & 255) * k)})`; };
const DARK = COLORS.map(c => c[0] === 'Black' ? '#77777f' : shade(c[1], .55));
const TRAILS = [['smoke', 'Smoke'], ['fire', 'Flame'], ['tint', 'Team color'], ['spark', 'Sparkle'], ['rainbow', 'Rainbow'], ['bubble', 'Bubbles'], ['none', 'No']];
// miss = chance a shot is sloppy, err = how far off (radians) a sloppy shot can go
const ETYPES = {
  a: { name: 'Cork',     color: '#a86b3c', speed: 0,  bs: 165, bounces: 1, max: 1, cd: 2.6, turn: 1.4, aimEvery: .6, miss: .5, err: .22 },
  b: { name: 'Scout',    color: '#6e7f8d', speed: 42, bs: 165, bounces: 1, max: 1, cd: 2.2, turn: 1.8, aimEvery: .5, pref: 300, miss: .45, err: .2 },
  c: { name: 'Hornet',   color: '#e07b24', speed: 58, bs: 330, bounces: 0, max: 1, cd: 1.9, turn: 2.4, aimEvery: .4, kind: 'rocket', pref: 340, miss: .35, err: .14 },
  d: { name: 'Sapper',   color: '#6a4f9e', speed: 92, bs: 170, bounces: 1, max: 1, cd: 2.6, turn: 2.0, aimEvery: .5, mines: 2, pref: 200, miss: .5, err: .2 },
  e: { name: 'Ricochet', color: '#d36aa8', speed: 58, bs: 200, bounces: 2, max: 2, cd: 1.5, turn: 2.8, aimEvery: .35, smart: true, pref: 320, miss: .3, err: .12 },
  f: { name: 'Brute',    color: '#3a3d44', speed: 70, bs: 215, bounces: 1, max: 4, cd: 1.7, burst: 3, burstGap: .2, turn: 3.2, aimEvery: .3, smart: true, pref: 240, miss: .4, err: .18 },
  g: { name: 'Ghost',    color: '#eef3f6', speed: 78, bs: 250, bounces: 1, max: 2, cd: 1.3, turn: 2.8, aimEvery: .35, smart: true, ghost: true, pref: 260, miss: .3, err: .12 },
  h: { name: 'Shotgun',  color: '#b5a642', speed: 64, bs: 230, bounces: 0, max: 5, cd: 2.2, turn: 2.6, aimEvery: .35, pellets: 5, spread: .5, life: .75, range: 280, pref: 150, miss: .3, err: .1 },
  m: { name: 'Missile',  color: '#2d6e8e', speed: 50, bs: 235, bounces: 2, max: 2, cd: 2.4, turn: 2.2, aimEvery: .4, kind: 'missile', smart: true, pref: 340, miss: .35, err: .15 },
  k: { name: 'Spiker',   color: '#9a3d2a', speed: 88, dash: 180, bs: 0, bounces: 0, max: 0, cd: 99, turn: 3, aimEvery: 1, pref: 0, miss: 0, err: 0, ram: true },
  w: { name: 'Bulwark',  color: '#3d6b5a', speed: 40, bs: 190, bounces: 1, max: 1, cd: 2.4, turn: 1.6, aimEvery: .5, pref: 260, miss: .35, err: .15, shield: true },
  q: { name: 'Mortar',   color: '#556b7a', speed: 36, bs: 0, bounces: 0, max: 0, cd: 3.6, turn: 2, aimEvery: .5, pref: 380, miss: 0, err: 0, mortar: true },
  x: { name: 'Hive',     color: '#8a6d1f', speed: 50, bs: 180, bounces: 1, max: 1, cd: 2.4, turn: 2, aimEvery: .45, pref: 280, miss: .4, err: .16, splits: 2 },
  y: { name: 'Hiveling', color: '#c08f3a', r: 10, speed: 96, bs: 200, bounces: 0, max: 1, cd: 1.8, turn: 3, aimEvery: .4, pref: 180, miss: .45, err: .2 },
  s: { name: 'Sniper',   color: '#5c6b2f', speed: 30, bs: 650, bounces: 1, max: 1, cd: 3.4, turn: 1.6, aimEvery: .45, kind: 'snipe', smart: true, charge: .6, pref: 420, miss: .15, err: .05 },
};
// When each enemy type can start showing up on the slot machines
const UNLOCK = { a: 1, b: 1, c: 3, h: 4, d: 5, k: 5, e: 6, m: 7, f: 8, w: 8, s: 9, q: 10, x: 11, g: 12 };
const unlockedTypes = lvl => Object.keys(UNLOCK).filter(k => lvl >= UNLOCK[k]);
const BOSSES = [
  { name: 'Juggernaut', color: '#6b2a2a', hp: 26, speed: 34, turn: 1.6, gap: 2.1, pref: 260, attacks: ['fan', 'mines', 'fan', 'ring'] },
  { name: 'Hydra',      color: '#24434f', hp: 30, speed: 40, turn: 1.8, gap: 2.0, pref: 300, attacks: ['missiles', 'fan', 'missiles', 'ring'] },
  { name: 'Warden',     color: '#4a3a62', hp: 34, speed: 46, turn: 2.2, gap: 1.9, pref: 320, attacks: ['ring', 'snipe', 'fan', 'mines', 'snipe'] },
];
const BOSS_R = 30;
// Each skill card first rolls a rarity, then a skill of that rarity.
const RARITY = {
  common:    { label: 'Common',    w: 60 },
  rare:      { label: 'Rare',      w: 26 },
  epic:      { label: 'Epic',      w: 10 },
  legendary: { label: 'Legendary', w: 2.5 },
  mythic:    { label: 'Mythic',    w: .4 },
};
// Skill formulas live here so the game and the "from → to" preview on each card always agree. n = rank.
const pct = v => Math.round(v * 100) + '%', secs = v => (Math.round(v * 10) / 10) + 's';
const F = {

// ---------- audio ----------
let AC = null, master = null, noiseBuf = null, lastBounce = 0;
function unlockAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.32; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume().catch(() => {});
  } catch (e) {}
}
function tone(f, dur, type, vol, slide, delay = 0) {
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .02);
}
function noise(dur, vol, cut, delay = 0) {
  const t0 = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(cut, t0); f.frequency.exponentialRampToValueAtTime(60, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur);
}
function playSfx(n) {
  if (!AC || AC.state !== 'running') return;
  switch (n) {
    case 'fire': tone(520, .09, 'square', .1, 150); noise(.06, .14, 3000); break;
    case 'rocket': tone(260, .2, 'sawtooth', .08, 900); noise(.16, .18, 5000); break;
    case 'bounce': if (AC.currentTime - lastBounce > .03) { lastBounce = AC.currentTime; tone(1500, .04, 'triangle', .06); } break;
    case 'pop': noise(.1, .2, 2600); break;
    case 'boom': noise(.75, .55, 1800); tone(90, .45, 'sine', .4, 35); break;
    case 'die': noise(1, .65, 1300); tone(150, .7, 'sawtooth', .16, 35); break;
    case 'mine': tone(660, .06, 'square', .07); tone(880, .07, 'square', .07, null, .08); break;
    case 'blink': tone(1250, .03, 'square', .03); break;
    case 'join': tone(440, .08, 'triangle', .14); tone(660, .14, 'triangle', .14, null, .08); break;
    case 'revive': [440, 554, 659, 880].forEach((f, i) => tone(f, .12, 'triangle', .12, null, i * .06)); break;
    case 'clear': [523, 659, 784, 1046].forEach((f, i) => tone(f, .2, 'triangle', .14, null, i * .12)); break;

      G.tanks.forEach(t => { if (t.team === 'e' && t.alive) { counts[t.type] = (counts[t.type] || 0) + 1; info[t.type] = t.spec; } });
      const keys = Object.keys(counts).sort((a, b) => (b.startsWith('boss') ? 1 : 0) - (a.startsWith('boss') ? 1 : 0) || a.localeCompare(b));
      const roster = keys.map(k => `<span><i class="dot" style="--c:${info[k].color}"></i>${k.startsWith('boss') ? `<b>${info[k].name}</b>&nbsp;(boss)` : `${counts[k]} ${info[k].name}`}</span>`).join('');
      const free = joinedCount() < 4 ? `<div class="note">Not playing yet? Press ${BA} to drop in.</div>` : '';
      const boss = isBossLevel(G.level);
      return `<div class="panel banner">${boss ? '<div class="eyebrow">Boss fight</div>' : ''}<h2>Level ${G.level}</h2><div class="roster">${roster}</div><div class="note">${G.lives} ${G.lives === 1 ? 'life' : 'lives'} left</div>${free}</div>`;
    }
    case 'skill': {
      const cards = G.skillChoices.map((id, i) => {
        const S = SKILL[id]; if (!S) return '';
        const have = sk(id);
        const lvlTxt = S.max > 1 && S.max < 99 ? `<span class="note">Rank ${have} → ${have + 1} of ${S.max}</span>` : '';
        let statTxt = '';
        if (S.stat) {
          const [lab, f, g] = S.stat, from = f(have), to = (g || f)(have + 1);
          statTxt = `<span class="stat">${lab}<br><b>${from}</b> <span class="arrow">→</span> <b class="to">${to}</b></span>`;
        }
        return `<button type="button" class="sk r-${S.rar}${G.cursor === i ? ' sel' : ''}" data-act="skill" data-i="${i}"><span class="rar">${RARITY[S.rar].label}</span><h4>${S.name}</h4><span>${S.desc}</span>${statTxt}${lvlTxt}</button>`;
      }).join('');
      const owned = Object.keys(G.skills).filter(id => SKILL[id] && id !== 'life').map(id => `<span class="own r-${SKILL[id].rar}">${SKILL[id].name}${G.skills[id] > 1 ? ' ×' + G.skills[id] : ''}</span>`).join(' · ');
      const next = G.reels.map(r => `${r.n} ${enemyName(r.t)}`).join(' · ');
      return `<div class="panel skillp"><div class="eyebrow">Level ${G.level} is next${isBossLevel(G.level) ? ' · Boss fight' : ''}</div><h2>Choose a skill</h2>
        <div class="skills">${cards}</div>
        <div class="note">Move with the stick, D-pad or arrow keys. Pick with ${BA}, <span class="k">ENTER</span> or a click. Anyone in the squad can choose.</div>
        <div class="note">Up next: <b>${next}</b>${isBossLevel(G.level) ? ` plus <b>${BOSSES[bossIndex(G.level) % BOSSES.length].name}</b>` : ''}</div>
        ${owned ? `<div class="note">Squad skills: ${owned}</div>` : ''}</div>`;
    }
    case 'paused':
      return `<div class="panel banner"><h2>Paused</h2>${G.msg ? `<div class="warn">${esc(G.msg)}</div>` : ''}
        <div class="row" style="justify-content:center">${ST} resume</div>
        <div class="row" style="justify-content:center"><span>${ffTxt}</span></div>
        <div class="row" style="justify-content:center"><span>${BB} <span class="k">Q</span> quit to title</span></div></div>`;
    case 'clear': {
      const bl = 1 + sk('trophy'), bonus = G.bossKill ? `<div class="note">Boss destroyed. ${bl === 1 ? 'Bonus life' : bl + ' bonus lives'} earned.</div>` : '';
      return `<div class="panel banner"><div class="eyebrow">Level ${G.level}</div><h2>${G.bossKill ? 'Boss down' : 'Cleared'}</h2>${bonus}</div>`;
    }
    case 'fail':
      return `<div class="panel banner"><div class="eyebrow">Squad wiped out</div><h2>${G.lives > 1 ? 'Try again' : 'Last life lost'}</h2><div class="note">${Math.max(0, G.lives - 1)} ${G.lives - 1 === 1 ? 'life' : 'lives'} left</div></div>`;
    case 'gameover': {
      const rows = G.slots.map((s, i) => s ? `<span style="color:${COLORS[s.color][1]}">P${i + 1}</span><span>${s.kills}</span><span>${s.deaths}</span>` : '').join('');
      const owned = Object.keys(G.skills).filter(id => SKILL[id]).map(id => `${SKILL[id].name}${G.skills[id] > 1 ? ' ×' + G.skills[id] : ''}`).join(' · ');
      return `<div class="panel banner"><div class="eyebrow">The run ended on level ${G.level}</div><h2>Game over</h2><div class="stats"><span class="h">Tank</span><span class="h">Kills</span><span class="h">Losses</span>${rows}</div>${owned ? `<div class="note">Skills: ${owned}</div>` : ''}<div class="go">Press ${BA} or <span class="k">ENTER</span> to continue</div></div>`;
    }
  }
  return '';
}
let lastOv = null;
function updateOverlay() { const h = overlayHTML(); if (h !== lastOv) { lastOv = h; ov.innerHTML = h; } }

// ---------- loop ----------
document.addEventListener('visibilitychange', () => {
  if (document.hidden && NET.mode !== 'client' && G.state === 'play') {
    G.state = 'paused'; G.msg = NET.mode === 'host' ? 'The host switched away from the game tab.' : '';
    if (NET.mode === 'host') sendSnapshot();
  }
});
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  pollPads(); buildInputs();
  if (NET.mode !== 'off') for (const dev in INP) if (INP[dev].voice) { toggleVoice(); break; }
  if (G.state === 'title') for (const dev in INP) {
    // tank choice is checked on the computer that owns the controller, since unlocks are saved there
    const inp = INP[dev]; if (!inp.cl && !inp.cr) continue;
    const i = slotOf(NET.mode === 'client' ? 'r:' + NET.myId + ':' + dev : dev);
    if (i >= 0) cycleChassis(i, inp.cr ? 1 : -1);
  }
  if (NET.mode === 'client') { clientSendInputs(now); clientUpdate(dt); }
  else {
    if (NET.mode === 'host') addRemoteInputs();
    update(dt);
    if (NET.mode === 'host') { NET.snapT -= dt; if (NET.snapT <= 0) { NET.snapT = 1 / 30; sendSnapshot(); } }
  }
  render(); updateHud(); updateOverlay();
  endInputFrame();
  requestAnimationFrame(frame);
}
addEventListener('beforeunload', () => { try { if (NET.peer) NET.peer.destroy(); } catch (e) {} });
if (location.hash === '#debug') window.RR_DEBUG = { G, loadLevel, genLayout, chooseSkill, pickSkills, SKILLS, aimPath, makeEnemy, hurt: hurtTank };
resize(); renderNet();
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { staticDirty = true; });
})();
</script>
</body>
