<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ricochet Regiment</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: one fitted arena canvas (toy blocks on a sand-colored desk), HUD strip above, control legend below, on a dark workshop surround. Single committed dark look. */
:root{
  --bg:#17140f;
  --panel:#221d16;
  --ink:#f1e6cf;
  --muted:#a8987b;
  --line:#3a3126;
  --accent:#f2b90f;
  --p1:#3fae4a; --p2:#e5484d; --p3:#3e7bfa; --p4:#f2b90f;
  --display:'Bungee','Impact','Arial Black',system-ui,sans-serif;
  --body:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 18px;font-size:13px}
.hgroup{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#hud b{font-family:var(--display);font-weight:400;font-size:16px;font-variant-numeric:tabular-nums}
#h-name{color:var(--muted)}
#h-ff{padding:1px 6px;border:1px solid var(--line);border-radius:3px}
#h-ff[data-on="1"]{color:var(--p2);border-color:var(--p2)}
.hud-slots{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 4px;border:1px solid var(--line);border-radius:4px;background:var(--panel);font-variant-numeric:tabular-nums;min-width:74px}
.chip i{width:14px;height:14px;border-radius:3px;background:var(--c);display:block}
.chip b{font-size:12px!important}
.chip span{font-size:12px;color:var(--muted)}
.chip[data-state="empty"]{opacity:.35}
.chip[data-state="empty"] i{background:transparent;border:1px dashed var(--muted)}
.chip[data-state="down"] i{background:repeating-linear-gradient(45deg,var(--c) 0 3px,transparent 3px 6px)}
.chip[data-state="down"] span{color:var(--p2)}
#wrap{flex:1;min-height:0;display:grid;place-items:center}
#frame{position:relative;container-type:size;box-shadow:0 0 0 1px #000,0 18px 50px rgba(0,0,0,.55);border-radius:6px;overflow:hidden;background:#e2d3b2}
#cv{display:block;width:100%;height:100%;cursor:crosshair}
#overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:clamp(10px,1.65cqw,17px)}
#legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 22px;font-size:12px;color:var(--muted)}
#legend > div{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:center}
#legend strong{color:var(--ink);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.btn{display:inline-grid;place-items:center;width:1.55em;height:1.55em;border-radius:50%;font-weight:700;color:#14110d;font-size:.82em;vertical-align:.08em;font-family:var(--body)}
.btn.a{background:var(--p1)}.btn.b{background:var(--p2)}.btn.x{background:var(--p3)}.btn.y{background:var(--p4)}
.k{display:inline-block;border:1px solid currentColor;border-radius:3px;padding:0 .4em;font-size:.78em;font-weight:700;letter-spacing:.06em;line-height:1.45;vertical-align:.08em}

/* overlay panels */
.panel{background:rgba(23,20,15,.9);border:1px solid #4a3e2f;border-radius:6px;padding:1.6em 2em;max-width:78%;display:flex;flex-direction:column;gap:1em;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.title{align-items:stretch;width:62%}
.title h1{font-family:var(--display);font-weight:400;font-size:4.4em;line-height:.92;margin:0;color:var(--ink);text-wrap:balance;letter-spacing:.01em}
.title h1 span{color:var(--accent)}
.sub{margin:0;color:var(--muted);font-size:1.05em;max-width:42em}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:.6em}
.slot{border:1px dashed #5a4b39;border-radius:5px;padding:.7em .6em;display:flex;flex-direction:column;gap:.35em;min-height:5.2em;min-width:0}
.slot .pn{font-family:var(--display);font-size:1.4em;color:var(--muted)}
.slot .dv{font-size:.85em;color:var(--muted);overflow-wrap:anywhere}
.slot.on{border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.slot.on .pn{color:var(--c)}
.slot.on .dv{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:.5em 1.4em;align-items:center}
.go{font-family:var(--display);font-size:1.35em;color:var(--accent);animation:pulse 1.4s ease-in-out infinite}
.note{font-size:.85em;color:var(--muted)}
.warn{font-size:.9em;color:#ffb4a8;border-left:3px solid var(--p2);padding-left:.7em}
.banner{text-align:center;align-items:center;background:rgba(23,20,15,.82)}
.eyebrow{font-size:.85em;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.banner h2{font-family:var(--display);font-weight:400;font-size:3.2em;margin:0;line-height:1;text-wrap:balance}
.roster{display:flex;flex-wrap:wrap;justify-content:center;gap:.4em 1.1em}
.roster span{display:inline-flex;align-items:center;gap:.4em}
.dot{width:.85em;height:.85em;border-radius:2px;background:var(--c);display:inline-block;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.stats{display:grid;grid-template-columns:auto auto auto;gap:.3em 1.6em;font-variant-numeric:tabular-nums;text-align:left}
.stats .h{font-size:.75em;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.go{animation:none}}
@media (max-width:700px){#legend{display:none}.title{width:auto}.slots{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="app">
  <header id="hud">
    <div class="hgroup"><span class="lbl">Stage</span><b id="h-stage">–</b><span id="h-name"></span></div>
    <div class="hgroup"><span class="lbl">Enemies</span><b id="h-enemies">–</b><span class="lbl">Lives</span><b id="h-lives">–</b><span class="lbl" id="h-ff">Friendly fire off</span></div>
    <div class="hud-slots">
      <div class="chip" data-state="empty" style="--c:var(--p1)"><i></i><b>P1</b><span>–</span></div>
      <div class="chip" data-state="empty" style="--c:var(--p2)"><i></i><b>P2</b><span>–</span></div>
      <div class="chip" data-state="empty" style="--c:var(--p3)"><i></i><b>P3</b><span>–</span></div>
      <div class="chip" data-state="empty" style="--c:var(--p4)"><i></i><b>P4</b><span>–</span></div>
    </div>
  </header>
  <div id="wrap"><div id="frame"><canvas id="cv"></canvas><div id="overlay"></div></div></div>
  <footer id="legend">
    <div><strong>Controller</strong><span>Left stick move</span><span>Right stick aim</span><span><span class="k">RT</span> / <span class="btn x">X</span> fire</span><span><span class="k">LT</span> / <span class="btn a">A</span> mine</span><span><span class="k">START</span> pause</span></div>
    <div><strong>Keyboard</strong><span>WASD move</span><span>Mouse aim</span><span>Click / Space fire</span><span>Right-click / E mine</span><span>Esc pause</span></div>
  </footer>
</div>

<script>
(() => {
'use strict';
// ---------- constants ----------
const TS = 40, COLS = 24, ROWS = 16, W = TS * COLS, H = TS * ROWS, R = 14, TAU = Math.PI * 2;
const PSPEED = 105, PBS = 255, PMAX = 5, PCD = 0.16, MINE_R = 72;
const PCOL = ['#3fae4a', '#e5484d', '#3e7bfa', '#f2b90f'];
const PDARK = ['#1f6b28', '#8f2226', '#1d4fb8', '#a87c00'];
const ETYPES = {
  a: { name: 'Cork',     color: '#a86b3c', speed: 0,  bs: 165, bounces: 1, max: 1, cd: 2.6, turn: 1.4, aimEvery: .6 },
  b: { name: 'Scout',    color: '#6e7f8d', speed: 42, bs: 165, bounces: 1, max: 1, cd: 2.2, turn: 1.8, aimEvery: .5, pref: 300 },
  c: { name: 'Hornet',   color: '#e07b24', speed: 58, bs: 330, bounces: 0, max: 1, cd: 1.9, turn: 2.4, aimEvery: .4, rocket: true, pref: 340 },
  d: { name: 'Sapper',   color: '#6a4f9e', speed: 92, bs: 170, bounces: 1, max: 1, cd: 2.6, turn: 2.0, aimEvery: .5, mines: 2, pref: 200 },
  e: { name: 'Ricochet', color: '#d36aa8', speed: 58, bs: 200, bounces: 2, max: 2, cd: 1.5, turn: 2.8, aimEvery: .35, smart: true, pref: 320 },
  f: { name: 'Brute',    color: '#3a3d44', speed: 70, bs: 215, bounces: 1, max: 4, cd: 1.7, burst: 3, burstGap: .2, turn: 3.2, aimEvery: .3, smart: true, pref: 240 },
  g: { name: 'Ghost',    color: '#eef3f6', speed: 78, bs: 250, bounces: 1, max: 2, cd: 1.3, turn: 2.8, aimEvery: .35, smart: true, ghost: true, pref: 260 },
};
// Map legend: # wall  + crate (mines break it)  o pit (blocks tanks, not shells)  1-4 player spawns  a-g enemies
const STAGES = [
 { name: 'Opening Move', map: [
  '........................','........................','........................',
  '..........##............','...1......##......a.....','..........##............',
  '..2.....................','.....+++........+++.....','.....+++........+++.....',
  '..3.....................','..........##............','...4......##......a.....',
  '..........##............','........................','........................','........................']},
 { name: 'Crossfire', map: [
  '........................','........................','..1.......#.........b...',
  '..........#.............','..........#.....###.....','..2.....................',
  '......##................','......##.....a..........','......##................',
  '..3.....................','..........#.....###.....','..........#.............',
  '..4.......#.........b...','........................','........................','........................']},
 { name: 'Crate Alley', map: [
  '........................','........+.......+.......','..1.....+...b...+.......',
  '........+.......+...a...','........+++..+++........','..2.....................',
  '...........##...........','......+....##....+......','......+....##....+..c...',
  '..3........##...........','........................','........+++..+++........',
  '........+.......+.......','..4.....+...b...+.......','........+.......+.......','........................']},
 { name: 'Sinkholes', map: [
  '........................','........................','..1.........oo......c...',
  '...........oooo.........','...........oooo.........','..2.........oo..........',
  '.......##.........##....','.......##....d....##....','.......##.........##....',
  '..3.........oo..........','...........oooo.........','...........oooo.........',
  '..4.........oo......c...','................b.......','........................','........................']},
 { name: 'Bank Shot', map: [
  '........................','........................','..1.....#...............',
  '........#.......e.......','........#...............','..2.....#######.........',
  '........................','...............###......','......###.........c.....',
  '..3.....................','........#######.........','........#...............',
  '..4.....#.......e.......','........#...........b...','........................','........................']},
 { name: 'Minefield', map: [
  '........................','.....+.......+......+...','..1.....+..........d....',
  '...........+............','......+.........+....a..','..2.........##..........',
  '.......+....##......+...','...+........##..c.......','........+...##..........',
  '..3.........##.....+....','......+..........+......','...........+.......c....',
  '..4...+.................','.........+.......d...+..','...+..........+.........','........................']},
 { name: 'Iron Curtain', map: [
  '........................','........................','..1.......#####.........',
  '..................f.....','...........#............','..2........#....++......',
  '...........#....++..e...','.....###...#............','...........#............',
  '..3........#....++..b...','...........#....++......','...........#............',
  '..4...............f.....','..........#####.........','........................','........................']},
 { name: 'Phantom Row', map: [
  '........................','..........o.............','..1.......o.....g.......',
  '..........o.............','......+++.......###.....','..2.....................',
  '..........##........c...','....oo....##....e.......','....oo....##............',
  '..3.......##........d...','........................','......+++.......###.....',
  '..........o.............','..4.......o.....g.......','..........o.............','........................']},
 { name: 'Gauntlet', map: [
  '........................','..+.....#.......#.......','..1.....#...e...#...f...',
  '........#.......#.......','........+.......+.......','..2.....................',
  '.....##...........##....','.....##.....g.....##.c..','.....##...........##....',
  '..3.....................','........+.......+.......','........#.......#.......',
  '..4.....#...e...#...d...','..+.....#.......#.......','........................','........................']},
 { name: 'Last Stand', map: [
  '........................','..........+.............','..1.......+.....f....g..',
  '..........+.............','.....###......###.......','..2...........#....e....',
  '..............#.........','.......oo...........d...','.......oo...............',
  '..3...........#.........','..............#....e....','.....###......###.......',
  '..........+.............','..4.......+.....f....g..','..........+.............','........................']},
];

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// ---------- canvas ----------
const cv = $('#cv'), ctx = cv.getContext('2d');
const scv = document.createElement('canvas'), sctx = scv.getContext('2d');
const frameEl = $('#frame'), wrapEl = $('#wrap'), ov = $('#overlay');
let RS = 1, staticDirty = true;
function resize() {
  const aw = wrapEl.clientWidth, ah = wrapEl.clientHeight;
  const s = Math.max(0.2, Math.min(aw / W, ah / H));
  frameEl.style.width = Math.floor(W * s) + 'px';
  frameEl.style.height = Math.floor(H * s) + 'px';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = scv.width = Math.max(1, Math.round(W * s * dpr));
  cv.height = scv.height = Math.max(1, Math.round(H * s * dpr));
  RS = cv.width / W; staticDirty = true;
}
addEventListener('resize', resize);

// ---------- audio ----------
let AC = null, master = null, noiseBuf = null, lastBounce = 0;
function unlockAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.32; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume().catch(() => {});
  } catch (e) {}
}
function tone(f, dur, type, vol, slide, delay = 0) {
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .02);
}
function noise(dur, vol, cut, delay = 0) {
  const t0 = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(cut, t0); f.frequency.exponentialRampToValueAtTime(60, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur);
}
function sfx(n) {
  if (!AC || AC.state !== 'running') return;
  switch (n) {
    case 'fire': tone(520, .09, 'square', .1, 150); noise(.06, .14, 3000); break;
    case 'rocket': tone(260, .2, 'sawtooth', .08, 900); noise(.16, .18, 5000); break;
    case 'bounce': if (AC.currentTime - lastBounce > .03) { lastBounce = AC.currentTime; tone(1500, .04, 'triangle', .06); } break;
    case 'pop': noise(.1, .2, 2600); break;
    case 'boom': noise(.75, .55, 1800); tone(90, .45, 'sine', .4, 35); break;
    case 'die': noise(1, .65, 1300); tone(150, .7, 'sawtooth', .16, 35); break;
    case 'mine': tone(660, .06, 'square', .07); tone(880, .07, 'square', .07, null, .08); break;
    case 'blink': tone(1250, .03, 'square', .03); break;
    case 'join': tone(440, .08, 'triangle', .14); tone(660, .14, 'triangle', .14, null, .08); break;
    case 'revive': [440, 554, 659, 880].forEach((f, i) => tone(f, .12, 'triangle', .12, null, i * .06)); break;
    case 'clear': [523, 659, 784, 1046].forEach((f, i) => tone(f, .2, 'triangle', .14, null, i * .12)); break;
    case 'fail': [392, 330, 262, 196].forEach((f, i) => tone(f, .25, 'triangle', .14, null, i * .16)); break;
    case 'tick': tone(900, .04, 'square', .05); break;
  }
}

// ---------- input ----------
const kb = { keys: new Set(), pressed: new Set(), mx: W / 2, my: H / 2, click: false, rclick: false };
const PREVENT = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab']);
addEventListener('keydown', e => {
  if (PREVENT.has(e.code)) e.preventDefault();
  if (!e.repeat) kb.pressed.add(e.code);
  kb.keys.add(e.code); unlockAudio();
});
addEventListener('keyup', e => kb.keys.delete(e.code));
addEventListener('blur', () => kb.keys.clear());
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  kb.mx = (e.clientX - r.left) / r.width * W; kb.my = (e.clientY - r.top) / r.height * H;
});
cv.addEventListener('mousedown', e => { unlockAudio(); if (e.button === 0) kb.click = true; if (e.button === 2) kb.rclick = true; });
cv.addEventListener('contextmenu', e => e.preventDefault());

const pads = {}; let padError = null;
function pollPads() {
  let list = [];
  try { list = navigator.getGamepads ? Array.from(navigator.getGamepads()) : []; padError = null; }
  catch (e) { padError = e && e.name || 'blocked'; }
  const seen = new Set();
  for (const gp of list) {
    if (!gp || !gp.connected) continue;
    seen.add(gp.index);
    const s = pads[gp.index] || (pads[gp.index] = { btn: [], prev: [] });
    s.gp = gp; s.connected = true; s.prev = s.btn;
    s.btn = gp.buttons.map((b, i) => (i === 6 || i === 7) ? b.value > 0.35 : b.pressed);
    s.axes = gp.axes;
    if (s.btn.some((b, i) => b && !s.prev[i])) unlockAudio();
  }
  for (const k in pads) if (!seen.has(+k)) { pads[k].connected = false; pads[k].btn = []; pads[k].prev = []; }
}
const padIdx = dev => +dev.slice(3);
const padConnected = dev => dev === 'kb' || !!(pads[padIdx(dev)] && pads[padIdx(dev)].connected);
function stick(x, y, dz) {
  const m = Math.hypot(x, y); if (m < dz) return [0, 0, 0];
  const n = Math.min(1, (m - dz) / (1 - dz)); return [x / m * n, y / m * n, n];
}
let INP = {};
function buildInputs() {
  INP = {};
  const k = c => kb.keys.has(c) ? 1 : 0, p = c => kb.pressed.has(c);
  let mx = clamp(k('KeyD') + k('ArrowRight') - k('KeyA') - k('ArrowLeft'), -1, 1);
  let my = clamp(k('KeyS') + k('ArrowDown') - k('KeyW') - k('ArrowUp'), -1, 1);
  if (mx && my) { mx *= Math.SQRT1_2; my *= Math.SQRT1_2; }
  INP.kb = { mx, my, mouseAim: true, aim: null,
    fire: p('Space') || kb.click, mine: p('KeyE') || p('ShiftLeft') || p('ShiftRight') || kb.rclick,
    start: p('Escape') || p('KeyP'), a: p('Enter') || p('Space'), b: p('Escape') || p('KeyQ') || p('Backspace'), y: p('KeyF') };
  for (const i in pads) {
    const s = pads[i]; if (!s.connected) continue;
    const pp = n => !!(s.btn[n] && !s.prev[n]);
    const ax = s.axes || [];
    const [lx, ly] = stick(ax[0] || 0, ax[1] || 0, .2);
    const [rx, ry, rm] = stick(ax[2] || 0, ax[3] || 0, .3);
    // D-pad also moves
    let dx = (s.btn[15] ? 1 : 0) - (s.btn[14] ? 1 : 0), dy = (s.btn[13] ? 1 : 0) - (s.btn[12] ? 1 : 0);
    let fx = lx, fy = ly;
    if (!lx && !ly && (dx || dy)) { const m = Math.hypot(dx, dy); fx = dx / m; fy = dy / m; }
    INP['pad' + i] = { mx: fx, my: fy, mouseAim: false, aim: rm > 0 ? Math.atan2(ry, rx) : null,
      fire: pp(7) || pp(5) || pp(2), mine: pp(6) || pp(4) || pp(0),
      start: pp(9), a: pp(0), b: pp(1), y: pp(3), back: pp(8) };
  }
}
function endInputFrame() { kb.pressed.clear(); kb.click = false; kb.rclick = false; }
function rumble(dev, strong, weak, ms) {
  if (!dev || dev === 'kb') return;
  const s = pads[padIdx(dev)]; const act = s && s.gp && s.gp.vibrationActuator;
  if (!act || !act.playEffect) return;

    else if (p.kind === 'spark') { c.globalAlpha = k; c.strokeStyle = p.color; c.lineWidth = p.size; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * .035, p.y - p.vy * .035); c.stroke(); }
  }
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  // labels + mouse reticle
  for (const t of G.tanks) if (t.alive && t.team === 'p') label(t.x, t.y - 30, `P${t.slot + 1}`, PCOL[t.slot], 1);
  const kbs = slotOf('kb');
  if (kbs >= 0 && (G.state === 'play' || G.state === 'intro')) {
    c.strokeStyle = PCOL[kbs]; c.lineWidth = 2; c.beginPath(); c.arc(kb.mx, kb.my, 8, 0, TAU);
    c.moveTo(kb.mx - 13, kb.my); c.lineTo(kb.mx - 5, kb.my); c.moveTo(kb.mx + 5, kb.my); c.lineTo(kb.mx + 13, kb.my);
    c.moveTo(kb.mx, kb.my - 13); c.lineTo(kb.mx, kb.my - 5); c.moveTo(kb.mx, kb.my + 5); c.lineTo(kb.mx, kb.my + 13); c.stroke();
  }
}
function label(x, y, text, color, a) {
  const c = ctx; c.font = GLYPH_FONT; const w = c.measureText(text).width + 10;
  c.globalAlpha = a; c.fillStyle = 'rgba(23,20,15,.82)'; rrect(c, x - w / 2, y - 8, w, 16, 4); c.fill();
  c.fillStyle = color; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, x, y + .5); c.globalAlpha = 1;
}
// a little parade of tanks behind the title card
const parade = [];
function drawTitleScene() {
  if (!parade.length) {
    const cols = [...PCOL, ETYPES.a.color, ETYPES.e.color, ETYPES.f.color, ETYPES.c.color];
    cols.forEach((col, i) => parade.push({ x: i * 130 - 80, y: i % 2 ? 590 : 600, body: 0, turret: 0, tread: 0, recoil: 0, col, i }));
  }
  for (const t of parade) {
    t.x += 0.6; if (t.x > W + 60) t.x -= W + 160; t.tread += .6;
    t.turret = Math.sin(G.time * .8 + t.i) * .6;
    drawTank(t, t.col, 'rgba(20,14,8,.85)', 1);
  }
}

// ---------- HUD + overlay ----------
const hud = { stage: $('#h-stage'), name: $('#h-name'), en: $('#h-enemies'), lives: $('#h-lives'), ff: $('#h-ff'), chips: [...document.querySelectorAll('.chip')] };
function setText(el, v) { v = String(v); if (el._v !== v) { el._v = v; el.textContent = v; } }
function setAttr(el, k, v) { if (el.dataset[k] !== v) el.dataset[k] = v; }
function updateHud() {
  const inGame = G.state !== 'title';
  setText(hud.stage, inGame ? `${Math.min(G.stage + 1, STAGES.length)}/${STAGES.length}` : '–');
  setText(hud.name, inGame ? STAGES[Math.min(G.stage, STAGES.length - 1)].name : '');
  setText(hud.en, inGame ? G.tanks.filter(t => t.alive && t.team === 'e').length : '–');
  setText(hud.lives, inGame ? G.lives : '–');
  setText(hud.ff, G.ff ? 'Friendly fire on' : 'Friendly fire off'); setAttr(hud.ff, 'on', G.ff ? '1' : '0');
  hud.chips.forEach((chip, i) => {
    const s = G.slots[i];
    const alive = G.tanks.some(t => t.alive && t.team === 'p' && t.slot === i);
    setAttr(chip, 'state', !s ? 'empty' : (!inGame || alive) ? 'ok' : 'down');
    setText(chip.lastElementChild, !s ? '–' : !inGame ? 'ready' : (!alive ? 'down · ' : '') + s.kills + ' KO');
  });
}
const BA = '<span class="btn a">A</span>', BB = '<span class="btn b">B</span>', BY = '<span class="btn y">Y</span>', ST = '<span class="k">START</span>';
const devName = d => d === 'kb' ? 'Keyboard + mouse' : `Controller ${padIdx(d) + 1}`;
function overlayHTML() {
  const ffTxt = `${BY} <span class="k">F</span> Friendly fire: <b>${G.ff ? 'On' : 'Off'}</b>`;
  switch (G.state) {
    case 'title': {
      const nPads = Object.values(pads).filter(p => p.connected).length;
      const slots = G.slots.map((s, i) => s
        ? `<div class="slot on" style="--c:${PCOL[i]}"><div class="pn">P${i + 1}</div><div class="dv">${devName(s.dev)}</div><div class="note">${s.dev === 'kb' ? '<span class="k">ESC</span>' : BB} to leave</div></div>`
        : `<div class="slot"><div class="pn">P${i + 1}</div><div class="dv">Press ${BA} to join</div><div class="note">or <span class="k">SPACE</span> on keyboard</div></div>`).join('');
      const padLine = padError
        ? `<div class="warn">This embedded view blocks controller access. Open the downloaded <b>ricochet-regiment.html</b> file in Chrome or Edge to play with Xbox controllers. Keyboard and mouse still work here.</div>`
        : `<div class="note">${nPads ? `${nPads} controller${nPads > 1 ? 's' : ''} connected.` : 'No controllers detected yet.'} Press any button on a controller to wake it up.</div>`;
      return `<div class="panel title"><h1>Ricochet<br><span>Regiment</span></h1>
        <p class="sub">Co-op tank combat for up to four players. Shells bounce off walls, mines clear crates, and a downed teammate can be revived by parking on their wreck.</p>
        <div class="slots">${slots}</div>
        <div class="row"><span>${ffTxt}</span></div>
        <div class="go">${joinedCount() ? `Press ${ST} or <span class="k">ENTER</span> to deploy` : `Press ${BA} to join`}</div>
        ${padLine}</div>`;
    }
    case 'intro': {
      const counts = {}; G.tanks.forEach(t => { if (t.team === 'e' && t.alive) counts[t.type] = (counts[t.type] || 0) + 1; });
      const roster = Object.keys(counts).sort().map(k => `<span><i class="dot" style="--c:${ETYPES[k].color}"></i>${counts[k]} ${ETYPES[k].name}</span>`).join('');
      const free = joinedCount() < 4 ? `<div class="note">Not playing yet? Press ${BA} to drop in.</div>` : '';
      return `<div class="panel banner"><div class="eyebrow">Stage ${G.stage + 1} of ${STAGES.length}</div><h2>${STAGES[G.stage].name}</h2><div class="roster">${roster}</div><div class="note">${G.lives} ${G.lives === 1 ? 'life' : 'lives'} left</div>${free}</div>`;
    }
    case 'paused':
      return `<div class="panel banner"><h2>Paused</h2>${G.msg ? `<div class="warn">${G.msg}</div>` : ''}
        <div class="row" style="justify-content:center">${ST} resume</div>
        <div class="row" style="justify-content:center"><span>${ffTxt}</span></div>
        <div class="row" style="justify-content:center"><span>${BB} <span class="k">Q</span> quit to title</span></div></div>`;
    case 'clear': {
      const bonus = (G.stage + 1) % 3 === 0 && G.stage + 1 < STAGES.length ? '<div class="note">Bonus life earned</div>' : '';
      return `<div class="panel banner"><div class="eyebrow">Stage ${G.stage + 1}</div><h2>Cleared</h2>${bonus}</div>`;
    }
    case 'fail':
      return `<div class="panel banner"><div class="eyebrow">Squad wiped out</div><h2>${G.lives > 1 ? 'Try again' : 'Last life lost'}</h2><div class="note">${G.lives - 1} ${G.lives - 1 === 1 ? 'life' : 'lives'} left</div></div>`;
    case 'gameover': case 'victory': {
      const rows = G.slots.map((s, i) => s ? `<span style="color:${PCOL[i]}">P${i + 1}</span><span>${s.kills}</span><span>${s.deaths}</span>` : '').join('');
      const head = G.state === 'victory' ? `<div class="eyebrow">All ${STAGES.length} stages cleared</div><h2>Victory</h2>` : `<div class="eyebrow">Reached stage ${G.reached + 1} · ${STAGES[G.reached].name}</div><h2>Game over</h2>`;
      return `<div class="panel banner">${head}<div class="stats"><span class="h">Tank</span><span class="h">Kills</span><span class="h">Losses</span>${rows}</div><div class="go">Press ${BA} or <span class="k">ENTER</span> to continue</div></div>`;
    }
  }
  return '';
}
let lastOv = null;
function updateOverlay() { const h = overlayHTML(); if (h !== lastOv) { lastOv = h; ov.innerHTML = h; } }

// ---------- loop ----------
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') { G.state = 'paused'; G.msg = ''; } });
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  pollPads(); buildInputs();
  update(dt);
  render(); updateHud(); updateOverlay();
  endInputFrame();
  requestAnimationFrame(frame);
}
resize(); requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { staticDirty = true; });
})();
</script>
