<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ricochet Regiment">
  <!-- Ricochet Regiment logo: a top-down green tank firing a shell that bounces off a wall -->
  <rect width="64" height="64" rx="14" fill="#17140f"/>
  <clipPath id="arena"><rect x="4" y="4" width="56" height="56" rx="11"/></clipPath>
  <g clip-path="url(#arena)">
    <rect x="4" y="4" width="56" height="56" fill="#e2d3b2"/>
    <!-- wall the shell bounces off -->
    <rect x="49" y="4" width="11" height="56" fill="#8b5a33"/>
    <path d="M49 4v56" stroke="#5e3a1f" stroke-width="1.5"/>
  </g>
  <!-- shell path: out of the barrel, off the wall, and back -->
  <path d="M38 24 L48 15 L40 7" fill="none" stroke="#17140f" stroke-width="2" stroke-dasharray="2.4 2.6" stroke-linecap="round" opacity=".55"/>
  <circle cx="40" cy="7.6" r="2.6" fill="#f2b90f" stroke="#17140f" stroke-width="1.2"/>
  <g transform="rotate(-42 27 37)">
    <!-- treads -->
    <rect x="12" y="23" width="32" height="7.5" rx="3" fill="#2b2620"/>
    <rect x="12" y="43.5" width="32" height="7.5" rx="3" fill="#2b2620"/>
    <path d="M16 24v5.5M20.5 24v5.5M25 24v5.5M29.5 24v5.5M34 24v5.5M38.5 24v5.5M16 44.5v5.5M20.5 44.5v5.5M25 44.5v5.5M29.5 44.5v5.5M34 44.5v5.5M38.5 44.5v5.5" stroke="#55493b" stroke-width="1.6"/>
    <!-- hull -->
    <rect x="14" y="28" width="28" height="18" rx="4" fill="#3fae4a" stroke="#17140f" stroke-width="1.6"/>
    <rect x="16" y="30" width="24" height="3" rx="1.5" fill="#7fd08a" opacity=".6"/>
    <!-- barrel -->
    <rect x="28" y="34.6" width="22" height="4.8" rx="1.6" fill="#2b2620"/>
    <rect x="46" y="33.8" width="5" height="6.4" rx="1.4" fill="#2b2620"/>
    <!-- turret -->
    <circle cx="27" cy="37" r="7.6" fill="#2f8a39" stroke="#17140f" stroke-width="1.6"/>
    <circle cx="27" cy="37" r="3.2" fill="#3fae4a" stroke="#17140f" stroke-width="1.2"/>
  </g>
</svg>
